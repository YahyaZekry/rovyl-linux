name: Publish to AUR

on:
  # Releases here are created by softprops/action-gh-release with GITHUB_TOKEN, and
  # events raised by GITHUB_TOKEN do not trigger other workflows — so `release:
  # published` never fires. Watch the Linux build finish instead, and act only on tags.
  workflow_run:
    workflows: ["Linux builds"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the AUR (e.g. v1.17.0)"
        required: true

jobs:
  aur:
    name: Update rovyl-bin on AUR
    # Tag runs only; the branch runs of "Linux builds" have nothing to publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Syu --noconfirm openssh curl

      - name: Download AppImage from release
        env:
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$RUN_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::Not a version tag: '$TAG'"
            exit 1
          fi
          VER=${TAG#v}
          curl -fL -o rovyl.AppImage "https://github.com/${{ github.repository }}/releases/download/${TAG}/Rovyl-${VER}-linux.AppImage"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "SHA=$(sha256sum rovyl.AppImage | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Update PKGBUILD and .SRCINFO
        run: |
          cd aur
          sed -i "s/^pkgver=.*/pkgver=$VER/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$SHA')/" PKGBUILD
          useradd -m builder
          chown -R builder .
          su builder -c "cd $PWD && makepkg --printsrcinfo" > .SRCINFO
          cat .SRCINFO

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new"
          git clone ssh://aur@aur.archlinux.org/rovyl-bin.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "YahyaZekry"
          git config user.email "YahyaZekry@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $VER" || echo "No changes to commit"
          git push origin master
