name: Container image

# Publishes the app as a container to ghcr.io — this is what populates the repo's
# "Packages" section. Runs on every main push (rolling `latest`), every version tag
# (pinned versions), and on demand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr requires lowercase; github.repository would carry the owner's capitals.
  IMAGE_NAME: yahyazekry/rovyl-linux

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libxtst-dev

      - name: Install dependencies
        run: npm ci

      - name: Build (renderer + native helper)
        run: npm run build

      # `dir` target = the unpacked app tree the Dockerfile copies in. It lands in
      # build-out/; the image context expects it at the repo root (see .dockerignore).
      - name: Package (unpacked)
        run: |
          npx electron-builder --linux dir --publish never
          rm -rf linux-unpacked
          mv build-out/linux-unpacked linux-unpacked

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
