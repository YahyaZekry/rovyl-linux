name: Review upstream changes

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-fork
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch upstream for review
        run: |
          git remote add upstream https://github.com/arshit09/rovyl.git
          git fetch upstream main

      - name: Write review report
        run: |
          node scripts/upstream-review.mjs > "$RUNNER_TEMP/upstream-review.md"
          cat "$RUNNER_TEMP/upstream-review.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: upstream-review
          path: ${{ runner.temp }}/upstream-review.md
          if-no-files-found: error
